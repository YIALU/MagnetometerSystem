name: Windows CI

on:
  pull_request:
    branches: [master, 'codex/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Select the installed .NET 8 SDK
        env:
          DOTNET_SDK_VERSION: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: dotnet new globaljson --sdk-version "$env:DOTNET_SDK_VERSION" --roll-forward disable --output (Split-Path -Parent $env:GITHUB_WORKSPACE)

      - name: Restore dependencies
        run: dotnet restore MagnetometerSystem.sln

      - name: Build solution
        run: dotnet build MagnetometerSystem.sln --configuration Debug --no-restore -m:1

      - name: Run tests
        run: dotnet test MagnetometerSystem.sln --configuration Debug --no-build --no-restore -m:1 --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
